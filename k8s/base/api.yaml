apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      # Service env vars such as FLOCI_PORT=tcp://... would collide with app settings.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: agro-rag-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: agro-rag-config
            - secretRef:
                name: agro-rag-secrets
          env:
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prometheus
          # Loading the embedding model can take a while: the startup probe holds the
          # other probes back for up to 5 minutes.
          startupProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 5
            failureThreshold: 60
          # Liveness only checks the process, so a database outage never restarts pods.
          livenessProbe:
            httpGet: { path: /livez, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness fails only when the database is down; Redis and Ollama degrade the
          # service without taking the pod out of rotation.
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 768Mi }
            limits: { memory: 2Gi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 120
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      # Service env vars such as FLOCI_PORT=tcp://... would collide with app settings.
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: agro-rag-api:latest
          imagePullPolicy: IfNotPresent
          command: ["agro-rag", "worker"]
          envFrom:
            - configMapRef:
                name: agro-rag-config
            - secretRef:
                name: agro-rag-secrets
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 2Gi }
