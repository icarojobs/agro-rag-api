# Development credentials only. In a real cluster, create this Secret out of band
# (sealed-secrets, External Secrets, or the cloud secret manager).
apiVersion: v1
kind: Secret
metadata:
  name: agro-rag-secrets
type: Opaque
stringData:
  POSTGRES_USER: agro
  POSTGRES_PASSWORD: agro
  POSTGRES_DB: agro
  AGRO_DATABASE_URL: postgresql+asyncpg://agro:agro@postgres:5432/agro
  AGRO_AWS_ACCESS_KEY_ID: test
  AGRO_AWS_SECRET_ACCESS_KEY: test
