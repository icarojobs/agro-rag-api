x-app-env: &app-env
  AGRO_ENVIRONMENT: docker
  AGRO_DATABASE_URL: postgresql+asyncpg://agro:agro@db:5432/agro
  AGRO_OLLAMA_BASE_URL: http://ollama:11434
  AGRO_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.19.0
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.19.0
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  migrate:
    image: agro-rag-api:latest
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: agro-rag-api:latest
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment: *app-env
    volumes:
      - hf-cache:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    image: agro-rag-api:dev
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      AGRO_DATABASE_URL: postgresql+asyncpg://agro:agro@db:5432/agro_test
      AGRO_EMBEDDING_PROVIDER: hashing
      AGRO_LLM_PROVIDER: fake
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf-cache:
  ollama:
