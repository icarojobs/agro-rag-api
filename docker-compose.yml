services:
  api:
    build:
      context: .
      target: runtime
    image: agro-rag-api:latest
    ports:
      - "8000:8000"
    environment:
      AGRO_ENVIRONMENT: docker
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    build:
      context: .
      target: dev
    image: agro-rag-api:dev
    profiles: ["test"]
