x-app-env: &app-env
  AGRO_ENVIRONMENT: docker
  AGRO_DATABASE_URL: postgresql+asyncpg://agro:agro@db:5432/agro
  AGRO_REDIS_URL: redis://redis:6379/0
  AGRO_OLLAMA_BASE_URL: http://ollama:11434
  AGRO_OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
  AGRO_OTEL_ENABLED: "true"
  AGRO_OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
  AGRO_MLFLOW_TRACKING_URI: http://mlflow:5000

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agro
      POSTGRES_PASSWORD: agro
      POSTGRES_DB: agro
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agro -d agro"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.19.0
    ports:
      - "11435:11434"
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-pull:
    image: ollama/ollama:0.19.0
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen2.5:3b}"]
    environment:
      OLLAMA_HOST: ollama:11434
    depends_on:
      ollama:
        condition: service_healthy

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.1
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlflow/artifacts
      - --serve-artifacts
      - --allowed-hosts=*
    ports:
      - "5000:5000"
    volumes:
      - mlflow:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: agro-rag-api:latest
    build:
      context: .
      target: runtime
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy

  api:
    image: agro-rag-api:latest
    build:
      context: .
      target: runtime
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      # uvicorn reads WEB_CONCURRENCY; each worker loads its own copy of the model.
      WEB_CONCURRENCY: ${API_WORKERS:-4}
      OMP_NUM_THREADS: ${API_TORCH_THREADS:-2}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
    volumes:
      - hf-cache:/models
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  tests:
    image: agro-rag-api:dev
    build:
      context: .
      target: dev
    profiles: ["test"]
    environment:
      AGRO_DATABASE_URL: postgresql+asyncpg://agro:agro@db:5432/agro_test
      AGRO_EMBEDDING_PROVIDER: hashing
      AGRO_LLM_PROVIDER: fake
      AGRO_REDIS_URL: redis://redis:6379/15
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  locust:
    image: agro-rag-api:dev
    build:
      context: .
      target: dev
    profiles: ["load"]
    user: "1000:1000"
    command:
      - locust
      - -f
      - loadtest/locustfile.py
      - --host=http://api:8000
      - --headless
      - --users=${LOCUST_USERS:-50}
      - --spawn-rate=${LOCUST_SPAWN_RATE:-10}
      - --run-time=${LOCUST_RUN_TIME:-2m}
      - --csv=loadtest/results/search
      - --only-summary
    volumes:
      - ./loadtest:/app/loadtest
      - ./eval:/app/eval:ro

volumes:
  pgdata:
  hf-cache:
  ollama:
  mlflow:
