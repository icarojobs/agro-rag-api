name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agro
          POSTGRES_PASSWORD: agro
          POSTGRES_DB: agro_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U agro -d agro_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AGRO_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov-report=xml

  docker:
    runs-on: ubuntu-latest
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          tags: agro-rag-api:latest
          load: true
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: dev
          tags: agro-rag-api:dev
          load: true
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev
      - name: Run tests inside the dev image
        run: docker compose --profile test run --rm tests
      - name: Smoke test the API container
        run: |
          docker compose up -d --wait api
          curl --fail --silent localhost:8000/health
          docker compose run --rm api agro-rag ingest
          curl --fail --silent localhost:8000/search -H 'content-type: application/json' \
            -d '{"query": "calagem do solo", "k": 3}'
          curl --fail --silent localhost:8000/ask -H 'content-type: application/json' \
            -d '{"question": "como corrigir a acidez do solo?"}'
      - name: Tear down
        if: always()
        run: docker compose --profile test down -v
